name: Production deploy trigger

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: production-deploy-trigger
  cancel-in-progress: true

jobs:
  wait-for-ci-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Waiting for CI on $GITHUB_SHA"
          for i in $(seq 1 60); do
            conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | if . == null then "missing" elif .status != "completed" then "running" else .conclusion end')"
            echo "CI state: $conclusion ($i/60)"
            case "$conclusion" in
              success) break ;;
              failure|cancelled|timed_out|action_required) echo "CI did not pass"; exit 1 ;;
            esac
            sleep 10
          done
          if [ "$conclusion" != "success" ]; then
            echo "Timed out waiting for CI"
            exit 1
          fi

      - name: Ensure main did not move
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          echo "Trigger SHA: $GITHUB_SHA"
          echo "Current main SHA: $current_sha"
          test "$current_sha" = "$GITHUB_SHA"

      - name: Dispatch production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Production deployment dispatched for $GITHUB_SHA"
