name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Runtime smoke test
        run: python scripts/ci_smoke.py
      - name: Run tests
        run: pytest -q
      - name: Build Docker image
        run: docker build -t marketplace-parser:ci .
      - name: Publish CI commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ job.status }}" in
            success) state=success; description="CI passed" ;;
            cancelled) state=error; description="CI cancelled" ;;
            *) state=failure; description="CI failed" ;;
          esac
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -n \
              --arg state "$state" \
              --arg context "ci" \
              --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg description "$description" \
              '{state:$state, context:$context, target_url:$target_url, description:$description}')" >/dev/null
          echo "Published CI commit status: $state"
