name: Deploy to Timeweb

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.TIMEWEB_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H '${{ secrets.TIMEWEB_HOST }}' >> ~/.ssh/known_hosts

      - name: Deploy and verify
        run: |
          ssh '${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}' 'set -e
            mkdir -p /opt/marketplace-parser/repo
            cd /opt/marketplace-parser/repo

            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone --branch main https://github.com/7b964ktxpc-web/pricewatcher-telegram.git .
            fi

            docker compose up -d --build --remove-orphans

            echo "=== CONTAINERS ==="
            docker compose ps

            echo "=== WAITING FOR HEALTH ==="
            for i in $(seq 1 15); do
              if curl -fsS --max-time 5 http://127.0.0.1:8010/health; then
                echo
                echo "HEALTH OK"
                exit 0
              fi
              echo "Waiting for application... $i/15"
              sleep 2
            done

            echo "=== HEALTHCHECK FAILED ==="
            docker compose ps
            echo "=== CONTAINER STATE ==="
            docker inspect repo-marketplace-parser-1 --format "{{json .State}}" || true
            echo "=== APPLICATION LOGS ==="
            docker compose logs --tail=200
            exit 1'
