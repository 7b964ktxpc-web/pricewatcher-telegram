name: Deploy to Timeweb

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIMEWEB_HOST: ${{ secrets.TIMEWEB_HOST }}
      TIMEWEB_USER: ${{ secrets.TIMEWEB_USER }}
      TIMEWEB_SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
      TIMEWEB_APP_DIR: ${{ secrets.TIMEWEB_APP_DIR || '/opt/marketplace-parser/repo' }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate deployment configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
        run: |
          set -euo pipefail
          test -n "$TIMEWEB_HOST"
          test -n "$TIMEWEB_USER"
          test -n "$TIMEWEB_SSH_KEY"
          test -n "$TIMEWEB_APP_DIR"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$ADMIN_BOT_TOKEN"
          test -n "$ADMIN_USER_IDS"
          echo "Deployment configuration OK"

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$TIMEWEB_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/$TIMEWEB_HOST/22'
          echo "Timeweb SSH port reachable"

      - name: Deploy and verify
        id: deploy_verify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WB_FEED_URL: ${{ secrets.WB_FEED_URL }}
          OZON_FEED_URL: ${{ secrets.OZON_FEED_URL }}
          SIMALAND_FEED_URL: ${{ secrets.SIMALAND_FEED_URL }}
          DETMIR_FEED_URL: ${{ secrets.DETMIR_FEED_URL }}
          AKUSHERSTVO_FEED_URL: ${{ secrets.AKUSHERSTVO_FEED_URL }}
          KORABLIK_FEED_URL: ${{ secrets.KORABLIK_FEED_URL }}
        run: |
          set -euo pipefail
          b64() { printf '%s' "$1" | base64 -w0; }
          export TOKEN_B64="$(b64 "$TELEGRAM_BOT_TOKEN")"
          export ADMIN_TOKEN_B64="$(b64 "$ADMIN_BOT_TOKEN")"
          export ADMIN_IDS_B64="$(b64 "$ADMIN_USER_IDS")"
          export DEEPSEEK_B64="$(b64 "$DEEPSEEK_API_KEY")"
          export HF_B64="$(b64 "$HF_TOKEN")"
          export GROQ_B64="$(b64 "$GROQ_API_KEY")"
          export GEMINI_B64="$(b64 "$GEMINI_API_KEY")"
          export WB_API_B64="$(b64 "$WB_API_TOKEN")"
          export WB_FEED_B64="$(b64 "$WB_FEED_URL")"
          export OZON_FEED_B64="$(b64 "$OZON_FEED_URL")"
          export SIMALAND_FEED_B64="$(b64 "$SIMALAND_FEED_URL")"
          export DETMIR_FEED_B64="$(b64 "$DETMIR_FEED_URL")"
          export AKUSHERSTVO_FEED_B64="$(b64 "$AKUSHERSTVO_FEED_URL")"
          export KORABLIK_FEED_B64="$(b64 "$KORABLIK_FEED_URL")"
          export EXPECTED_SHA="$DEPLOY_SHA"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
            "$TIMEWEB_USER@$TIMEWEB_HOST" \
            "APP_DIR='$TIMEWEB_APP_DIR' EXPECTED_SHA='$EXPECTED_SHA' TOKEN_B64='$TOKEN_B64' ADMIN_TOKEN_B64='$ADMIN_TOKEN_B64' ADMIN_IDS_B64='$ADMIN_IDS_B64' DEEPSEEK_B64='$DEEPSEEK_B64' HF_B64='$HF_B64' GROQ_B64='$GROQ_B64' GEMINI_B64='$GEMINI_B64' WB_API_B64='$WB_API_B64' WB_FEED_B64='$WB_FEED_B64' OZON_FEED_B64='$OZON_FEED_B64' SIMALAND_FEED_B64='$SIMALAND_FEED_B64' DETMIR_FEED_B64='$DETMIR_FEED_B64' AKUSHERSTVO_FEED_B64='$AKUSHERSTVO_FEED_B64' KORABLIK_FEED_B64='$KORABLIK_FEED_B64' bash -se" < scripts/deploy_remote.sh

      - name: Publish production deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ steps.deploy_verify.outcome }}" in
            success) state=success; description="Production deployment verified" ;;
            cancelled) state=error; description="Production deployment cancelled" ;;
            *) state=failure; description="Production deployment failed" ;;
          esac
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$DEPLOY_SHA" \
            -d "$(jq -n --arg state "$state" --arg context "production-deploy" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg description "$description" '{state:$state, context:$context, target_url:$target_url, description:$description}')" >/dev/null
          echo "Published production commit status: $state"
