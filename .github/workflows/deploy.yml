name: Deploy to Timeweb

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.TIMEWEB_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H '${{ secrets.TIMEWEB_HOST }}' >> ~/.ssh/known_hosts

      - name: Deploy and verify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_BUSINESS_ID: ${{ secrets.YANDEX_MARKET_BUSINESS_ID }}
          WB_FEED_URL: ${{ secrets.WB_FEED_URL }}
          OZON_FEED_URL: ${{ secrets.OZON_FEED_URL }}
          YANDEX_MARKET_FEED_URL: ${{ secrets.YANDEX_MARKET_FEED_URL }}
          SIMALAND_FEED_URL: ${{ secrets.SIMALAND_FEED_URL }}
          DETMIR_FEED_URL: ${{ secrets.DETMIR_FEED_URL }}
          AKUSHERSTVO_FEED_URL: ${{ secrets.AKUSHERSTVO_FEED_URL }}
          KORABLIK_FEED_URL: ${{ secrets.KORABLIK_FEED_URL }}
        run: |
          TOKEN_B64="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | base64 -w0)"
          DEEPSEEK_B64="$(printf '%s' "$DEEPSEEK_API_KEY" | base64 -w0)"
          HF_B64="$(printf '%s' "$HF_TOKEN" | base64 -w0)"
          GROQ_B64="$(printf '%s' "$GROQ_API_KEY" | base64 -w0)"
          GEMINI_B64="$(printf '%s' "$GEMINI_API_KEY" | base64 -w0)"
          WB_API_B64="$(printf '%s' "$WB_API_TOKEN" | base64 -w0)"
          YM_API_B64="$(printf '%s' "$YANDEX_MARKET_API_KEY" | base64 -w0)"
          YM_BUSINESS_B64="$(printf '%s' "$YANDEX_MARKET_BUSINESS_ID" | base64 -w0)"
          WB_FEED_B64="$(printf '%s' "$WB_FEED_URL" | base64 -w0)"
          OZON_FEED_B64="$(printf '%s' "$OZON_FEED_URL" | base64 -w0)"
          YM_FEED_B64="$(printf '%s' "$YANDEX_MARKET_FEED_URL" | base64 -w0)"
          SIMALAND_FEED_B64="$(printf '%s' "$SIMALAND_FEED_URL" | base64 -w0)"
          DETMIR_FEED_B64="$(printf '%s' "$DETMIR_FEED_URL" | base64 -w0)"
          AKUSHERSTVO_FEED_B64="$(printf '%s' "$AKUSHERSTVO_FEED_URL" | base64 -w0)"
          KORABLIK_FEED_B64="$(printf '%s' "$KORABLIK_FEED_URL" | base64 -w0)"
          ssh '${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}' "set -e
            mkdir -p /opt/marketplace-parser/repo
            cd /opt/marketplace-parser/repo
            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone --branch main https://github.com/7b964ktxpc-web/pricewatcher-telegram.git .
            fi
            : > .env.telegram
            write_secret() { key=\"\$1\"; value=\"\$2\"; if [ -n \"\$value\" ]; then printf '%s=' \"\$key\" >> .env.telegram; printf '%s' \"\$value\" | base64 -d >> .env.telegram; printf '\\n' >> .env.telegram; fi; }
            write_secret TELEGRAM_BOT_TOKEN '$TOKEN_B64'
            write_secret DEEPSEEK_API_KEY '$DEEPSEEK_B64'
            write_secret HF_TOKEN '$HF_B64'
            write_secret GROQ_API_KEY '$GROQ_B64'
            write_secret GEMINI_API_KEY '$GEMINI_B64'
            write_secret WB_API_TOKEN '$WB_API_B64'
            write_secret YANDEX_MARKET_API_KEY '$YM_API_B64'
            write_secret YANDEX_MARKET_BUSINESS_ID '$YM_BUSINESS_B64'
            write_secret WB_FEED_URL '$WB_FEED_B64'
            write_secret OZON_FEED_URL '$OZON_FEED_B64'
            write_secret YANDEX_MARKET_FEED_URL '$YM_FEED_B64'
            write_secret SIMALAND_FEED_URL '$SIMALAND_FEED_B64'
            write_secret DETMIR_FEED_URL '$DETMIR_FEED_B64'
            write_secret AKUSHERSTVO_FEED_URL '$AKUSHERSTVO_FEED_B64'
            write_secret KORABLIK_FEED_URL '$KORABLIK_FEED_B64'
            chmod 600 .env.telegram
            docker compose --env-file .env.telegram up -d --build --remove-orphans
            echo '=== CONTAINERS ==='
            docker compose ps
            echo '=== WAITING FOR HEALTH ==='
            for i in \$(seq 1 15); do
              if curl -fsS --max-time 5 http://127.0.0.1:8010/health; then
                echo
                echo 'HEALTH OK'
                if docker compose ps --status running --services | grep -qx telegram-bot && docker compose ps --status running --services | grep -qx watchlist-checker; then
                  echo 'TELEGRAM BOT RUNNING'
                  echo 'WATCHLIST CHECKER RUNNING'
                  echo '=== CONNECTION DASHBOARD ==='
                  curl -fsS --max-time 10 http://127.0.0.1:8010/api/connections
                  echo
                  exit 0
                fi
              fi
              echo \"Waiting for application... \$i/15\"
              sleep 2
            done
            echo '=== DEPLOY VERIFICATION FAILED ==='
            docker compose ps
            echo '=== APPLICATION LOGS ==='
            docker compose logs --tail=200
            exit 1"
