name: Deploy to Timeweb

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIMEWEB_HOST: ${{ secrets.TIMEWEB_HOST }}
      TIMEWEB_USER: ${{ secrets.TIMEWEB_USER }}
      TIMEWEB_SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
      TIMEWEB_APP_DIR: ${{ secrets.TIMEWEB_APP_DIR || '/opt/marketplace-parser/repo' }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
        run: |
          set -euo pipefail
          test -n "$TIMEWEB_HOST"
          test -n "$TIMEWEB_USER"
          test -n "$TIMEWEB_SSH_KEY"
          test -n "$TIMEWEB_APP_DIR"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$ADMIN_BOT_TOKEN"
          test -n "$ADMIN_USER_IDS"
          echo "Deployment configuration OK"

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$TIMEWEB_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$TIMEWEB_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy and verify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_BUSINESS_ID: ${{ secrets.YANDEX_MARKET_BUSINESS_ID }}
          WB_FEED_URL: ${{ secrets.WB_FEED_URL }}
          OZON_FEED_URL: ${{ secrets.OZON_FEED_URL }}
          YANDEX_MARKET_FEED_URL: ${{ secrets.YANDEX_MARKET_FEED_URL }}
          SIMALAND_FEED_URL: ${{ secrets.SIMALAND_FEED_URL }}
          DETMIR_FEED_URL: ${{ secrets.DETMIR_FEED_URL }}
          AKUSHERSTVO_FEED_URL: ${{ secrets.AKUSHERSTVO_FEED_URL }}
          KORABLIK_FEED_URL: ${{ secrets.KORABLIK_FEED_URL }}
        run: |
          set -euo pipefail

          b64() { printf '%s' "$1" | base64 -w0; }
          export TOKEN_B64="$(b64 "$TELEGRAM_BOT_TOKEN")"
          export ADMIN_TOKEN_B64="$(b64 "$ADMIN_BOT_TOKEN")"
          export ADMIN_IDS_B64="$(b64 "$ADMIN_USER_IDS")"
          export DEEPSEEK_B64="$(b64 "$DEEPSEEK_API_KEY")"
          export HF_B64="$(b64 "$HF_TOKEN")"
          export GROQ_B64="$(b64 "$GROQ_API_KEY")"
          export GEMINI_B64="$(b64 "$GEMINI_API_KEY")"
          export WB_API_B64="$(b64 "$WB_API_TOKEN")"
          export YM_API_B64="$(b64 "$YANDEX_MARKET_API_KEY")"
          export YM_BUSINESS_B64="$(b64 "$YANDEX_MARKET_BUSINESS_ID")"
          export WB_FEED_B64="$(b64 "$WB_FEED_URL")"
          export OZON_FEED_B64="$(b64 "$OZON_FEED_URL")"
          export YM_FEED_B64="$(b64 "$YANDEX_MARKET_FEED_URL")"
          export SIMALAND_FEED_B64="$(b64 "$SIMALAND_FEED_URL")"
          export DETMIR_FEED_B64="$(b64 "$DETMIR_FEED_URL")"
          export AKUSHERSTVO_FEED_B64="$(b64 "$AKUSHERSTVO_FEED_URL")"
          export KORABLIK_FEED_B64="$(b64 "$KORABLIK_FEED_URL")"
          EXPECTED_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"

          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes "$TIMEWEB_USER@$TIMEWEB_HOST" \
            "APP_DIR='$TIMEWEB_APP_DIR' EXPECTED_SHA='$EXPECTED_SHA' TOKEN_B64='$TOKEN_B64' ADMIN_TOKEN_B64='$ADMIN_TOKEN_B64' ADMIN_IDS_B64='$ADMIN_IDS_B64' DEEPSEEK_B64='$DEEPSEEK_B64' HF_B64='$HF_B64' GROQ_B64='$GROQ_B64' GEMINI_B64='$GEMINI_B64' WB_API_B64='$WB_API_B64' YM_API_B64='$YM_API_B64' YM_BUSINESS_B64='$YM_BUSINESS_B64' WB_FEED_B64='$WB_FEED_B64' OZON_FEED_B64='$OZON_FEED_B64' YM_FEED_B64='$YM_FEED_B64' SIMALAND_FEED_B64='$SIMALAND_FEED_B64' DETMIR_FEED_B64='$DETMIR_FEED_B64' AKUSHERSTVO_FEED_B64='$AKUSHERSTVO_FEED_B64' KORABLIK_FEED_B64='$KORABLIK_FEED_B64' bash -se" <<'REMOTE'
          set -euo pipefail

          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          if [ -d .git ]; then
            git fetch origin main
            git checkout main
            git reset --hard origin/main
          else
            git clone --branch main https://github.com/7b964ktxpc-web/pricewatcher-telegram.git .
          fi

          DEPLOYED_SHA="$(git rev-parse HEAD)"
          test "$DEPLOYED_SHA" = "$EXPECTED_SHA"
          echo "DEPLOYED SHA: $DEPLOYED_SHA"

          : > .env.telegram
          write_secret() {
            key="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s=' "$key" >> .env.telegram
              printf '%s' "$value" | base64 -d >> .env.telegram
              printf '\n' >> .env.telegram
            fi
          }

          write_secret TELEGRAM_BOT_TOKEN "$TOKEN_B64"
          write_secret ADMIN_BOT_TOKEN "$ADMIN_TOKEN_B64"
          write_secret ADMIN_USER_IDS "$ADMIN_IDS_B64"
          write_secret DEEPSEEK_API_KEY "$DEEPSEEK_B64"
          write_secret HF_TOKEN "$HF_B64"
          write_secret GROQ_API_KEY "$GROQ_B64"
          write_secret GEMINI_API_KEY "$GEMINI_B64"
          write_secret WB_API_TOKEN "$WB_API_B64"
          write_secret YANDEX_MARKET_API_KEY "$YM_API_B64"
          write_secret YANDEX_MARKET_BUSINESS_ID "$YM_BUSINESS_B64"
          write_secret WB_FEED_URL "$WB_FEED_B64"
          write_secret OZON_FEED_URL "$OZON_FEED_B64"
          write_secret YANDEX_MARKET_FEED_URL "$YM_FEED_B64"
          write_secret SIMALAND_FEED_URL "$SIMALAND_FEED_B64"
          write_secret DETMIR_FEED_URL "$DETMIR_FEED_B64"
          write_secret AKUSHERSTVO_FEED_URL "$AKUSHERSTVO_FEED_B64"
          write_secret KORABLIK_FEED_URL "$KORABLIK_FEED_B64"
          chmod 600 .env.telegram

          export TELEGRAM_BOT_TOKEN="$(printf '%s' "$TOKEN_B64" | base64 -d)"
          export ADMIN_BOT_TOKEN="$(printf '%s' "$ADMIN_TOKEN_B64" | base64 -d)"
          export ADMIN_USER_IDS="$(printf '%s' "$ADMIN_IDS_B64" | base64 -d)"
          export DEEPSEEK_API_KEY="$(printf '%s' "$DEEPSEEK_B64" | base64 -d)"
          export HF_TOKEN="$(printf '%s' "$HF_B64" | base64 -d)"
          export GROQ_API_KEY="$(printf '%s' "$GROQ_B64" | base64 -d)"
          export GEMINI_API_KEY="$(printf '%s' "$GEMINI_B64" | base64 -d)"
          export WB_API_TOKEN="$(printf '%s' "$WB_API_B64" | base64 -d)"
          export YANDEX_MARKET_API_KEY="$(printf '%s' "$YM_API_B64" | base64 -d)"
          export YANDEX_MARKET_BUSINESS_ID="$(printf '%s' "$YM_BUSINESS_B64" | base64 -d)"
          export WB_FEED_URL="$(printf '%s' "$WB_FEED_B64" | base64 -d)"
          export OZON_FEED_URL="$(printf '%s' "$OZON_FEED_B64" | base64 -d)"
          export YANDEX_MARKET_FEED_URL="$(printf '%s' "$YM_FEED_B64" | base64 -d)"
          export SIMALAND_FEED_URL="$(printf '%s' "$SIMALAND_FEED_B64" | base64 -d)"
          export DETMIR_FEED_URL="$(printf '%s' "$DETMIR_FEED_B64" | base64 -d)"
          export AKUSHERSTVO_FEED_URL="$(printf '%s' "$AKUSHERSTVO_FEED_B64" | base64 -d)"
          export KORABLIK_FEED_URL="$(printf '%s' "$KORABLIK_FEED_B64" | base64 -d)"

          docker compose --env-file .env.telegram config >/dev/null
          docker compose --env-file .env.telegram up -d --build --remove-orphans
          docker compose ps

          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 http://127.0.0.1:8010/health >/dev/null; then
              echo "HEALTH OK"
              docker compose ps --status running --services | grep -qx marketplace-parser
              docker compose ps --status running --services | grep -qx telegram-bot
              docker compose ps --status running --services | grep -qx admin-bot
              docker compose ps --status running --services | grep -qx watchlist-checker
              echo "ALL SERVICES RUNNING"
              curl -fsS --max-time 10 http://127.0.0.1:8010/api/readiness
              echo
              exit 0
            fi
            echo "Waiting for application... $i/15"
            sleep 2
          done

          echo "DEPLOY VERIFICATION FAILED"
          docker compose ps
          docker compose logs --tail=200
          exit 1
          REMOTE
