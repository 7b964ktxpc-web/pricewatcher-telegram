name: CI heartbeat

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository
        run: |
          test -f .github/workflows/ci.yml
          test -f requirements.txt
          echo "GitHub Actions heartbeat OK"
