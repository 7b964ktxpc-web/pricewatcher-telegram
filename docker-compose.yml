services:
  marketplace-parser:
    build: .
    ports:
      - "8010:8010"
    restart: unless-stopped
    environment:
      PARSER_USER_AGENT: "MarketplaceParser/1.0"
      PARSER_TIMEOUT: "15"
      PARSER_RETRIES: "2"
      PARSER_BACKOFF: "1.0"
      WB_PUBLIC_ENABLED: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  telegram-bot:
    build: .
    command: ["python", "telegram_bot_runner.py"]
    restart: unless-stopped
    depends_on:
      marketplace-parser:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      HF_TOKEN: ${HF_TOKEN:-}
      VISION_API_URL: ${VISION_API_URL:-https://router.huggingface.co/hf-inference/models/Qwen/Qwen2.5-VL-7B-Instruct}
      VISION_TIMEOUT: ${VISION_TIMEOUT:-45}
      PARSER_PUBLIC_URL: http://marketplace-parser:8010
      TELEGRAM_HISTORY_SIZE: "12"
      TELEGRAM_TIMEOUT: "20"
