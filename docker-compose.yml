services:
  marketplace-parser:
    build: .
    ports:
      - "8010:8010"
    restart: unless-stopped
    environment:
      PARSER_USER_AGENT: "MarketplaceParser/1.0"
      PARSER_TIMEOUT: "15"
      PARSER_RETRIES: "2"
      PARSER_BACKOFF: "1.0"
      WB_PUBLIC_ENABLED: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
