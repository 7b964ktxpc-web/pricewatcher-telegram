services:
  marketplace-parser:
    build: .
    ports:
      - "8010:8010"
    restart: unless-stopped
    environment:
      PARSER_USER_AGENT: "MarketplaceParser/1.0"
      PARSER_TIMEOUT: "15"
      PARSER_RETRIES: "2"
      PARSER_BACKOFF: "1.0"
      WB_PUBLIC_ENABLED: "0"
      HF_TOKEN: ${HF_TOKEN:-}
      HF_AI_SPACE: ${HF_AI_SPACE:-victor/Qwen3.8-27B-free-endpoint}
      HF_AI_TIMEOUT: ${HF_AI_TIMEOUT:-90}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      PARSER_CATALOG_DB: /app/data/catalog.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - parser-data:/app/data

  telegram-bot:
    build: .
    command: ["python", "telegram_bot_runner.py"]
    restart: unless-stopped
    depends_on:
      marketplace-parser:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_ROUTER_MODEL: ${HF_ROUTER_MODEL:-Qwen/Qwen3-8B:fastest}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      VISION_API_URL: ${VISION_API_URL:-https://router.huggingface.co/hf-inference/models/Qwen/Qwen2.5-VL-7B-Instruct}
      VISION_TIMEOUT: ${VISION_TIMEOUT:-45}
      WATCHLIST_DB_PATH: /app/data/watchlist.sqlite3
      PARSER_PUBLIC_URL: http://marketplace-parser:8010
      TELEGRAM_HISTORY_SIZE: "12"
      TELEGRAM_TIMEOUT: "20"
    volumes:
      - telegram-data:/app/data

  watchlist-checker:
    build: .
    command: ["python", "watchlist_checker.py"]
    restart: unless-stopped
    depends_on:
      marketplace-parser:
        condition: service_healthy
      telegram-bot:
        condition: service_started
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      WATCHLIST_DB_PATH: /app/data/watchlist.sqlite3
      WATCHLIST_CHECK_INTERVAL: ${WATCHLIST_CHECK_INTERVAL:-1800}
      WATCHLIST_CHECK_TIMEOUT: ${WATCHLIST_CHECK_TIMEOUT:-20}
      PARSER_PUBLIC_URL: http://marketplace-parser:8010
    volumes:
      - telegram-data:/app/data

volumes:
  parser-data:
  telegram-data:
